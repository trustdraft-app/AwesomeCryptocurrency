<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b2a4a"/>
      <stop offset="100%" stop-color="#04101c"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2788f5"/>
      <stop offset="100%" stop-color="#42d2ce"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="34%" r="60%">
      <stop offset="0%" stop-color="#42d2ce" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#42d2ce" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="228" fill="url(#glow)"/>
  <!-- concentric lens rings -->
  <circle cx="512" cy="470" r="300" fill="none" stroke="#2788f5" stroke-opacity="0.18" stroke-width="10"/>
  <circle cx="512" cy="470" r="220" fill="none" stroke="#42d2ce" stroke-opacity="0.22" stroke-width="10"/>
  <!-- demand curve / peak mark -->
  <path d="M180 640 L360 470 L500 560 L660 300 L850 470" fill="none"
        stroke="url(#mark)" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="660" cy="300" r="34" fill="#04101c" stroke="#42d2ce" stroke-width="20"/>
  <!-- base line -->
  <rect x="180" y="760" width="670" height="16" rx="8" fill="#2788f5" fill-opacity="0.35"/>
</svg>
